<div class="toast" [class]="'toast-variant-' + data.variant">
  <mat-icon class="toast-icon">{{ icon }}</mat-icon>
  <span class="toast-message">{{ data.message }}</span>
  <button
    type="button"
    class="toast-close"
    (click)="close()"
    title="Cerrar"
    aria-label="Cerrar"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>
