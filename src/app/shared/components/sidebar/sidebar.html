<aside class="sidebar" [ngClass]="{ 'collapsed': isCollapsed() }">
  <div class="sidebar-header">
    <div class="logo-container">
      <img src="athenet-light.png" alt="Athenet" class="logo-img" />
    </div>
    <button
      type="button"
      class="toggle-btn"
      (click)="toggleSidebar()"
      [attr.title]="isCollapsed() ? 'Expandir menú' : 'Contraer menú'"
      [attr.aria-label]="isCollapsed() ? 'Expandir menú' : 'Contraer menú'"
      [attr.aria-expanded]="!isCollapsed()">
      <!-- Material Icons no trae el ícono de panel: el panel lateral se dibuja ancho o angosto según el estado. -->
      <svg class="toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="3" />
        @if (isCollapsed()) {
          <path d="M7 9v6" />
        } @else {
          <path d="M9 5v14" />
        }
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-list">
      @for (item of menuItems(); track item.route) {
        <li class="nav-item">
          <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
            <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logoutClick.emit()">
      <mat-icon class="nav-icon">logout</mat-icon>
      <span class="nav-label">Cerrar sesión</span>
    </button>
  </div>
</aside>
