<div class="deporte-detail-dialog">
  <div class="dialog-header">
    <div class="dialog-icon-wrapper variant-primary">
      <mat-icon>sports_soccer</mat-icon>
    </div>
    <div class="dialog-header-text">
      <h2 class="dialog-title">{{ deporte.nombre }}</h2>
    </div>
  </div>

  <div class="dialog-body">
    <div class="detail-field">
      <span class="detail-label">Descripción</span>
      <p class="detail-descripcion">{{ deporte.descripcion || 'Sin descripción registrada.' }}</p>
    </div>
  </div>

  <div class="dialog-actions">
    <app-button variant="secondary" (btnClick)="onClose()">Cerrar</app-button>
  </div>
</div>
