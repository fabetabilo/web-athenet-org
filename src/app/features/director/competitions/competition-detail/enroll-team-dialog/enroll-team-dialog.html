<div class="dialog-shell">
  <div class="dialog-header">
    <div class="dialog-icon-wrapper">
      <mat-icon>group_add</mat-icon>
    </div>
    <div class="dialog-header-text">
      <h2 class="dialog-title">Inscribir equipo</h2>
      <p class="dialog-subtitle">
        {{ data.competition.name }} · {{ data.competition.sport.name ?? 'Deporte' }}
      </p>
    </div>
  </div>

  <form class="dialog-body" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
    <app-team-picker
      label="Equipo"
      mode="matchup"
      [sportId]="data.competition.sport.id"
      [institution]="form.controls.institutionId"
      [campus]="form.controls.campusId"
      [team]="form.controls.teamId"
    />

    @if (error(); as message) {
      <div class="form-error-banner">
        <mat-icon>error_outline</mat-icon>
        <span>{{ message }}</span>
      </div>
    }
  </form>

  <div class="dialog-actions">
    <app-button variant="secondary" [disabled]="saving()" (btnClick)="onCancel()">Cancelar</app-button>
    <app-button variant="primary" icon="add" [loading]="saving()" (btnClick)="onSubmit()">
      Inscribir
    </app-button>
  </div>
</div>
