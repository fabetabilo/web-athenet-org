name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Generate environment.ts
        env:
          CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          CUSTOM_REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
          API_URL: ${{ secrets.APP_API_URL }}
          EVENTS_API_URL: ${{ secrets.APP_EVENTS_API_URL }}
        run: |
          mkdir -p src/environments
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REDIRECT="${CUSTOM_REDIRECT_URI:-https://${OWNER}.github.io/${REPO_NAME}/}"

          cat <<EOF > src/environments/environment.ts
          export const environment = {
            clientId: '${CLIENT_ID}',
            tenantId: '${TENANT_ID}',
            redirectUri: '${REDIRECT}',
            apiUrl: '${API_URL}',
            eventsApiUrl: '${EVENTS_API_URL}',
          };
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          npx ng build --configuration production --base-href "/${REPO_NAME}/"

      - name: Setup SPA routing (404.html) and disable Jekyll
        run: |
          cp dist/athenet-org-web/browser/index.html dist/athenet-org-web/browser/404.html
          touch dist/athenet-org-web/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/athenet-org-web/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
